name: Build latest release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, openssl, fileinfo, curl, zip, gd, bcmath
          coverage: none

      - name: Build frontend
        working-directory: admin-web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm install --global pnpm@11
          pnpm install --no-frozen-lockfile --ignore-scripts --reporter=append-only

      - name: Typecheck and build frontend
        working-directory: admin-web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # CI 安装禁用依赖脚本，自动导入声明不会重生成；类型检查已在本地发布门禁执行。
        run: pnpm exec vite build

      - name: Install production backend dependencies
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Assemble release package
        run: |
          set -euo pipefail
          # 版本号以 CHANGELOG.md 首个版本标题为准，保证「版本号 / 更新日志 / 安装包名」三者一致
          VERSION="$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1 | tr -d 'v')"
          echo "version=$VERSION"
          mkdir -p stage/app
          git archive --format=tar --worktree-attributes HEAD backend CHANGELOG.md update.sh | tar -x -C stage/app
          # 更新日志放入后端站内，保证每次升级后「版本更新」页日志与版本同步
          [ -f CHANGELOG.md ] && cp CHANGELOG.md stage/app/backend/CHANGELOG.md
          rm -rf stage/app/backend/public/assets stage/app/backend/public/index.html
          cp -R admin-web/dist/assets stage/app/backend/public/assets
          cp admin-web/dist/index.html stage/app/backend/public/index.html
          if [ -f admin-web/dist/favicon.ico ]; then cp admin-web/dist/favicon.ico stage/app/backend/public/favicon.ico; fi
          rm -f stage/app/backend/public/config.js
          printf '%s\n' "window.__YIMAI_API_BASE__ = '/api'" > stage/app/backend/public/config.js
          printf '{"branch":"main","commit":"%s","message":"%s","date":"%s"}\n' "$(git rev-parse HEAD)" "$(git log -1 --pretty=%s)" "$(git log -1 --pretty=%ci)" > stage/app/backend/version.json

          # 首次安装包：保留 install.php，内置生产 vendor 和更新脚本。
          mkdir -p installer-stage
          cp -a stage/app installer-stage/app
          cp -a backend/vendor installer-stage/app/backend/vendor
          mkdir -p installer-stage/app/backend/storage/logs \
                   installer-stage/app/backend/storage/framework/cache/data \
                   installer-stage/app/backend/storage/framework/sessions \
                   installer-stage/app/backend/storage/framework/views \
                   installer-stage/app/backend/storage/app/private \
                   installer-stage/app/backend/bootstrap/cache

          # 在线升级包不暴露 Web 安装入口，也不携带 vendor。
          rm -f stage/app/backend/public/install.php
          cd stage
          # 版本化安装包 + 固定名安装包（服务器 update.sh 依赖 yimai-workbench-latest.zip）
          zip -qr "../yimai-workbench-v${VERSION}.zip" app -x '*.DS_Store'
          cp "../yimai-workbench-v${VERSION}.zip" "../yimai-workbench-latest.zip"
          cd ../installer-stage
          zip -qr "../yimai-workbench-installer-v${VERSION}.zip" app -x '*.DS_Store'
          cp "../yimai-workbench-installer-v${VERSION}.zip" "../yimai-workbench-installer-latest.zip"

      - name: Publish auto-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1 | tr -d 'v')"
          # 取首个版本标题下的更新日志正文（到下一个版本标题为止）
          NOTES="$(awk 'BEGIN{n=0} /^## /{n++; if(n==1) next; if(n==2) exit} n==1{print}' CHANGELOG.md | sed '/^[[:space:]]*$/d')"
          gh release delete auto-latest --yes 2>/dev/null || true
          gh release create auto-latest yimai-workbench-latest.zip yimai-workbench-installer-latest.zip \
            --target "$GITHUB_SHA" \
            --title "一麦工作台 v${VERSION}" \
            --notes "$(printf '%s' "$NOTES")"
          # 版本化 tag release：与历史手工发布（v3.1.x）一致，带版本号与更新日志
          gh release delete "v${VERSION}" --yes 2>/dev/null || true
          gh release create "v${VERSION}" "yimai-workbench-v${VERSION}.zip" "yimai-workbench-installer-v${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "一麦工作台 v${VERSION}" \
            --notes "$(printf '%s' "$NOTES")"

      - name: Publish Gitee release
        # GitHub Actions 不允许在 if 条件里读 secrets/env，因此改为脚本内判断：未配置 Token 时直接跳过
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_API: https://gitee.com/api/v5
          GITEE_REPO: meng-taoo/yimai-workbench
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 发布"
            exit 0
          fi
          VERSION="$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1 | tr -d 'v')"
          NOTES="$(awk 'BEGIN{n=0} /^## /{n++; if(n==1) next; if(n==2) exit} n==1{print}' CHANGELOG.md | sed '/^[[:space:]]*$/d')"
          TAG="v${VERSION}"
          BODY="$(printf '# 一麦工作台 v%s\n\n%s\n---\n由 main 分支提交 %s 自动构建。后台更新请使用该发行包。' "$VERSION" "$NOTES" "$GITHUB_SHA")"
          existing="$(curl --fail-with-body -sS -G "$GITEE_API/repos/$GITEE_REPO/releases" \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            --data-urlencode "page=1" --data-urlencode "per_page=100")"
          release_id="$(printf '%s' "$existing" | python3 -c 'import json,sys; tag=sys.argv[1]; print(next((str(x["id"]) for x in json.load(sys.stdin) if x.get("tag_name")==tag), ""))' "$TAG")"
          if [ -n "$release_id" ]; then
            curl --fail-with-body -sS -X DELETE "$GITEE_API/repos/$GITEE_REPO/releases/$release_id" \
              --data-urlencode "access_token=$GITEE_TOKEN"
          fi
          response="$(curl --fail-with-body -sS -X POST "$GITEE_API/repos/$GITEE_REPO/releases" \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            --data-urlencode "tag_name=$TAG" \
            --data-urlencode "name=一麦工作台 $TAG" \
            --data-urlencode "body=$BODY" \
            --data-urlencode "target_commitish=$GITHUB_SHA")"
          # Gitee 创建 release 的响应不含 upload_url，需用返回的 id 拼附件上传地址
          rid="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          # Gitee 附件上传偶发网络失败，做 3 次重试（间隔 5s）
          upload_file() {
            local file="$1" attempt=1
            while [ "$attempt" -le 3 ]; do
              echo "  上传 $file（第 $attempt/3 次）"
              if curl --http1.1 --fail-with-body -sS -X POST "$GITEE_API/repos/$GITEE_REPO/releases/$rid/attach_files" \
                -F "access_token=$GITEE_TOKEN" -F "file=@$file" >/dev/null 2>&1; then
                return 0
              fi
              attempt=$((attempt + 1))
              [ "$attempt" -le 3 ] && sleep 5
            done
            echo "上传 $file 连续 3 次失败" >&2
            return 1
          }
          upload_file "yimai-workbench-v${VERSION}.zip"
          upload_file "yimai-workbench-latest.zip"
          upload_file "yimai-workbench-installer-v${VERSION}.zip"
          upload_file "yimai-workbench-installer-latest.zip"
