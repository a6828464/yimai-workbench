<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一麦瑜伽·普拉提 · 主页 — 风格C 暗夜高端会所</title>
<!-- ==========================================================
  一麦瑜伽·普拉提 小程序 · UI 风格方向 C 「暗夜高端会所 · 私教奢牌」
  本方向页面清单（ui-test/c-dark/，共 2 页）：
    ① home.html  —— 主页 mockup：全屏暗夜实景（压暗墨绿渐变）
                     + 金线细框大 logo + 衬线品牌大字 + 两块毛玻璃门店卡（BOOK NOW）
                     + 金色细描边胶囊（到店指引）+ 底部暖白 slogan
    ② guide.html —— 到店指引页 mockup：选门店 → 门店引导
                     （地址 / 导航·电话 / 视频号 / 门店实景 / 到店路线三段 / 换店）
  仅供 UI 方向评审 · 静态高保真 · 纯 HTML+CSS+少量原生 JS · 无构建无依赖
========================================================== -->
<style>
  :root{
    --ink:#0a120e;        /* 近黑深墨绿 */
    --ink2:#0e1713;       /* 面板深墨绿 */
    --paper:#f5efe4;      /* 暖白 */
    --gold:#c8a24e;       /* 暖铜金 */
    --gold-hi:#d8b96a;    /* 亮金 */
    --gold-cream:#e6d3a0; /* 金米色（浅字） */
    --serif:'Songti SC','STSong','STSong',Georgia,serif;
    --sans:'PingFang SC',-apple-system,'Helvetica Neue','Microsoft YaHei',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{background:#17191a;font-family:var(--sans);display:flex;justify-content:center;padding:20px 0;min-height:100vh;}

  /* ===== 手机框（390×844 屏幕 + 8px 黑边，隐藏滚动条） ===== */
  .phone{position:relative;flex:none;width:390px;height:844px;box-sizing:content-box;border:8px solid #000;border-radius:44px;background:var(--ink);overflow:hidden;box-shadow:0 34px 90px rgba(0,0,0,.68),0 0 0 1px rgba(255,255,255,.04);margin:auto;}
  .screen{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .screen::-webkit-scrollbar{display:none;}

  /* ===== 状态栏（纯 CSS 电池/WiFi/信号，白字） ===== */
  .statusbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 30px;pointer-events:none;--sbink:#ffffff;}
  .sb-time{font-size:14.5px;font-weight:600;letter-spacing:.02em;color:var(--sbink);font-family:-apple-system,'PingFang SC',sans-serif;font-variant-numeric:tabular-nums;}
  .sb-island{position:absolute;left:50%;top:8.5px;transform:translateX(-50%);width:96px;height:27px;border-radius:14px;background:#000;}
  .sb-icons{display:flex;align-items:center;gap:7px;}
  .sb-signal{display:flex;align-items:flex-end;gap:2.5px;height:11px;}
  .sb-signal i{width:3px;border-radius:1px;background:var(--sbink);}
  .sb-signal i:nth-child(1){height:4.5px}.sb-signal i:nth-child(2){height:6.5px}.sb-signal i:nth-child(3){height:8.5px}.sb-signal i:nth-child(4){height:11px}
  .sb-wifi{position:relative;width:16px;height:12px;}
  .sb-wifi i{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);border:1.6px solid transparent;border-top-color:var(--sbink);border-radius:50%;}
  .sb-wifi i:nth-child(1){width:16px;height:16px}
  .sb-wifi i:nth-child(2){width:10.5px;height:10.5px}
  .sb-wifi i:nth-child(3){width:5.5px;height:5.5px}
  .sb-wifi b{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);width:3px;height:3px;border-radius:50%;background:var(--sbink);}
  .sb-battery{position:relative;width:25px;height:12px;border:1px solid var(--sbink);border-radius:3.5px;padding:1.5px;}
  .sb-battery i{display:block;width:70%;height:100%;border-radius:2px;background:var(--sbink);}
  .sb-battery::after{content:'';position:absolute;right:-3.5px;top:50%;transform:translateY(-50%);width:1.8px;height:5px;border-radius:0 1px 1px 0;background:var(--sbink);}

  /* ===== 微信小程序胶囊（半透明底） ===== */
  .capsule{position:absolute;top:49px;right:11px;height:32px;padding:0 9px;border-radius:16px;background:rgba(255,255,255,.14);border:.5px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:9px;z-index:60;}
  .capsule .c-dots{display:flex;gap:3px;}
  .capsule .c-dots i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.92);}
  .capsule .c-div{width:1px;height:17px;background:rgba(255,255,255,.32);}
  .capsule .c-ring{width:15px;height:15px;border:1.3px solid rgba(255,255,255,.92);border-radius:50%;position:relative;}
  .capsule .c-ring::after{content:'';position:absolute;inset:4px;border-radius:50%;background:rgba(255,255,255,.92);}

  /* ===== 轻提示（金边毛玻璃） ===== */
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);background:rgba(14,23,19,.92);border:1px solid rgba(200,162,78,.45);color:var(--gold-cream);font-size:12px;letter-spacing:.08em;padding:11px 20px;border-radius:999px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .35s ease;z-index:80;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== 全屏背景：studio-night 压暗 60% 深墨绿渐变 ===== */
  .bg{position:absolute;inset:0;z-index:0;}
  .bg img{width:100%;height:100%;object-fit:cover;display:block;}
  .bg-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,14,.84) 0%,rgba(12,20,16,.6) 34%,rgba(10,18,14,.68) 60%,rgba(7,12,9,.92) 100%);}
  /* logo 后的微弱金色氛围光 */
  .bg-glow{position:absolute;left:50%;top:150px;width:440px;height:440px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(200,162,78,.13) 0%,rgba(200,162,78,.05) 40%,transparent 68%);pointer-events:none;}

  .home-inner{position:relative;z-index:1;min-height:844px;width:375px;margin:0 auto;padding:92px 20px 40px;display:flex;flex-direction:column;align-items:center;}

  /* ===== 上 1/3：大 logo + 金线细框 ===== */
  .logo-frame{position:relative;width:128px;height:128px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 38px rgba(200,162,78,.16);}
  .logo-frame::before{content:'';position:absolute;inset:0;border:1px solid rgba(200,162,78,.55);}
  .logo-frame::after{content:'';position:absolute;inset:6px;border:1px solid rgba(200,162,78,.22);}
  .logo-frame img{width:88px;height:88px;object-fit:contain;display:block;position:relative;z-index:1;}
  .corner{position:absolute;width:11px;height:11px;}
  .c-tl{top:-1.5px;left:-1.5px;border-top:1.5px solid var(--gold);border-left:1.5px solid var(--gold);}
  .c-tr{top:-1.5px;right:-1.5px;border-top:1.5px solid var(--gold);border-right:1.5px solid var(--gold);}
  .c-bl{bottom:-1.5px;left:-1.5px;border-bottom:1.5px solid var(--gold);border-left:1.5px solid var(--gold);}
  .c-br{bottom:-1.5px;right:-1.5px;border-bottom:1.5px solid var(--gold);border-right:1.5px solid var(--gold);}

  /* ===== 品牌大字 + 金字距标签 ===== */
  .brand{text-align:center;margin-top:32px;}
  .brand h1{font-family:var(--serif);font-weight:700;font-size:31px;color:var(--paper);letter-spacing:.09em;line-height:1.35;text-shadow:0 2px 22px rgba(0,0,0,.6);}
  .brand-label{margin-top:15px;display:flex;align-items:center;justify-content:center;gap:14px;}
  .bl-line{width:36px;height:1px;flex:none;}
  .bl-line.l{background:linear-gradient(90deg,transparent,rgba(200,162,78,.85));}
  .bl-line.r{background:linear-gradient(270deg,transparent,rgba(200,162,78,.85));}
  .bl-text{font-family:var(--serif);font-weight:500;font-size:10px;color:var(--gold);letter-spacing:.3em;margin-right:-.3em;}

  /* ===== 毛玻璃门店卡（hover 金描边亮起） ===== */
  .stores{width:100%;margin-top:42px;display:flex;flex-direction:column;gap:16px;}
  .store-card{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:23px 24px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);text-decoration:none;transition:border-color .35s,box-shadow .35s,transform .35s;cursor:pointer;}
  .store-card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);}
  .store-card:hover{border-color:rgba(200,162,78,.62);box-shadow:0 0 28px rgba(200,162,78,.15),inset 0 0 24px rgba(200,162,78,.05);transform:translateY(-2px);}
  .store-card:active{transform:scale(.98);}
  .sc-name{font-family:var(--serif);font-weight:500;font-size:19px;color:var(--paper);letter-spacing:.05em;}
  .sc-sub{margin-top:7px;font-size:12px;color:rgba(245,239,228,.6);letter-spacing:.08em;}
  .sc-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .sc-book{font-family:var(--serif);font-weight:500;font-size:9px;color:var(--gold);letter-spacing:.28em;margin-right:-.28em;}
  .g-arrow{display:flex;align-items:center;}
  .ga-line{width:30px;height:1px;background:linear-gradient(90deg,rgba(200,162,78,.2),var(--gold));transition:width .35s;}
  .ga-head{width:7px;height:7px;border-top:1px solid var(--gold);border-right:1px solid var(--gold);transform:rotate(45deg);margin-left:-6px;filter:drop-shadow(0 0 5px rgba(200,162,78,.55));}
  .store-card:hover .ga-line{width:40px;}

  /* ===== 金色细描边胶囊：第一次来 ===== */
  .guide-pill{margin-top:38px;display:inline-flex;align-items:center;gap:10px;padding:13px 30px;border-radius:999px;border:1px solid rgba(200,162,78,.5);background:rgba(200,162,78,.06);color:var(--gold-cream);font-size:13px;letter-spacing:.18em;text-decoration:none;transition:all .35s;cursor:pointer;}
  .guide-pill:hover{border-color:var(--gold);box-shadow:0 0 24px rgba(200,162,78,.25);background:rgba(200,162,78,.12);}
  .guide-pill:active{transform:scale(.96);}
  .gp-diamond{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 8px rgba(200,162,78,.8);flex:none;}

  /* ===== 底部 slogan（暖白小字居中） ===== */
  .spacer{flex:1;}
  .slogan{text-align:center;}
  .slogan .rule{width:26px;height:1px;background:rgba(200,162,78,.55);margin:0 auto 14px;}
  .slogan p{color:rgba(245,239,228,.58);font-size:12px;letter-spacing:.42em;margin-right:-.42em;}
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="bg">
        <img src="../assets/studio-night.png" alt="一麦瑜伽 夜景场馆" onerror="this.style.opacity='0'">
        <div class="bg-veil"></div>
        <div class="bg-glow"></div>
      </div>
      <div class="home-inner">
        <div class="hero">
          <div class="logo-frame">
            <i class="corner c-tl"></i><i class="corner c-tr"></i><i class="corner c-bl"></i><i class="corner c-br"></i>
            <img src="../assets/logo-white.png" alt="一麦瑜伽" onerror="this.style.opacity='0'">
          </div>
        </div>
        <div class="brand">
          <h1>一麦瑜伽·普拉提</h1>
          <div class="brand-label">
            <span class="bl-line l"></span>
            <span class="bl-text">YIMAI YOGA · PILATES</span>
            <span class="bl-line r"></span>
          </div>
        </div>
        <div class="stores">
          <a class="store-card" href="guide.html?store=green">
            <div class="sc-info">
              <div class="sc-name">一麦瑜伽 · 绿地店</div>
              <div class="sc-sub">绿地缤纷城 · 4 楼</div>
            </div>
            <div class="sc-side">
              <span class="sc-book">BOOK NOW</span>
              <span class="g-arrow"><i class="ga-line"></i><i class="ga-head"></i></span>
            </div>
          </a>
          <a class="store-card" href="guide.html?store=east">
            <div class="sc-info">
              <div class="sc-name">一麦瑜伽 · 东部店</div>
              <div class="sc-sub">江东 · 场馆</div>
            </div>
            <div class="sc-side">
              <span class="sc-book">BOOK NOW</span>
              <span class="g-arrow"><i class="ga-line"></i><i class="ga-head"></i></span>
            </div>
          </a>
        </div>
        <a class="guide-pill" href="guide.html">
          <i class="gp-diamond"></i>
          <span>第一次来 · 到店指引</span>
        </a>
        <div class="spacer"></div>
        <div class="slogan">
          <div class="rule"></div>
          <p>看见 · 包容 · 超越</p>
        </div>
      </div>
    </div>
    <div class="statusbar">
      <span class="sb-time">9:41</span>
      <span class="sb-island"></span>
      <span class="sb-icons">
        <span class="sb-signal"><i></i><i></i><i></i><i></i></span>
        <span class="sb-wifi"><i></i><i></i><i></i><b></b></span>
        <span class="sb-battery"><i></i></span>
      </span>
    </div>
    <div class="capsule">
      <span class="c-dots"><i></i><i></i><i></i></span>
      <span class="c-div"></span>
      <span class="c-ring"></span>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script>
    var toastTimer=null;
    function toast(msg){
      var el=document.getElementById('toast');
      el.textContent=msg;el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer=setTimeout(function(){el.classList.remove('show');},1600);
    }
  </script>
</body>
</html>
