<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一麦瑜伽·普拉提 · 主页 — 风格A 静奢东方</title>
<!-- ==========================================================
  一麦瑜伽·普拉提 小程序 · UI 风格方向 A 「静奢东方 · 留白即高级」
  本方向页面清单（ui-test/a-oriental/，共 2 页）：
    ① home.html  —— 主页 mockup：上 2/3 沉浸大图（底部渐入米灰）
                     + 衬线店名 + 两馆约课竖向长条 + 到店指引金线链接 + 员工入口 slogan
    ② guide.html —— 到店指引页 mockup：选门店 → 门店引导
                     （地址 / 导航·电话 / 视频号 / 门店实景 / 到店路线三段 / 换店）
  仅供 UI 方向评审 · 静态高保真 · 纯 HTML+CSS+少量原生 JS · 无构建无依赖
========================================================== -->
<style>
  :root{
    --bg:#f2f4f2;        /* 页面米灰底 */
    --paper:#fcfbf8;     /* 卡面暖白 */
    --green-deep:#1c6047;/* 墨绿 */
    --green:#2e7d5b;     /* 苔绿 */
    --ink:#22332b;       /* 正文墨色 */
    --ink-soft:#44554c;
    --muted:#7c8a82;
    --faint:#a6b1aa;
    --hairline:#eaeeeb;  /* 发丝线 */
    --gold:#c19a4b;      /* 香槟金（仅字距标签与指引链接） */
    --serif:'Songti SC','STSong','STSong','SimSun',serif;
    --sans:'PingFang SC',-apple-system,'Helvetica Neue','Microsoft YaHei',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  body{background:#17191a;font-family:var(--sans);display:flex;justify-content:center;padding:20px 0;min-height:100vh;}

  /* ===== 手机框（390×844 屏幕 + 8px 黑边，隐藏滚动条） ===== */
  .phone{position:relative;flex:none;width:390px;height:844px;box-sizing:content-box;border:8px solid #000;border-radius:44px;background:var(--bg);overflow:hidden;box-shadow:0 34px 90px rgba(0,0,0,.55);margin:auto;}
  .screen{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .screen::-webkit-scrollbar{display:none;}

  /* ===== 状态栏（纯 CSS 电池/WiFi/信号） ===== */
  .statusbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 30px;pointer-events:none;--sbink:#171b19;}
  .phone.immersive .statusbar{--sbink:#ffffff;}
  .sb-time{font-size:14.5px;font-weight:600;letter-spacing:.02em;color:var(--sbink);font-family:-apple-system,'PingFang SC',sans-serif;}
  .sb-island{position:absolute;left:50%;top:8.5px;transform:translateX(-50%);width:96px;height:27px;border-radius:14px;background:#000;}
  .sb-icons{display:flex;align-items:center;gap:7px;}
  .sb-signal{display:flex;align-items:flex-end;gap:2.5px;height:11px;}
  .sb-signal i{width:3px;border-radius:1px;background:var(--sbink);}
  .sb-signal i:nth-child(1){height:4.5px}.sb-signal i:nth-child(2){height:6.5px}.sb-signal i:nth-child(3){height:8.5px}.sb-signal i:nth-child(4){height:11px}
  .sb-wifi{position:relative;width:16px;height:12px;}
  .sb-wifi i{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);border:1.6px solid transparent;border-top-color:var(--sbink);border-radius:50%;}
  .sb-wifi i:nth-child(1){width:16px;height:16px}
  .sb-wifi i:nth-child(2){width:10.5px;height:10.5px}
  .sb-wifi i:nth-child(3){width:5.5px;height:5.5px}
  .sb-wifi b{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);width:3px;height:3px;border-radius:50%;background:var(--sbink);}
  .sb-battery{position:relative;width:25px;height:12px;border:1px solid var(--sbink);border-radius:3.5px;padding:1.5px;}
  .sb-battery i{display:block;width:70%;height:100%;border-radius:2px;background:var(--sbink);}
  .sb-battery::after{content:'';position:absolute;right:-3.5px;top:50%;transform:translateY(-50%);width:1.8px;height:5px;border-radius:0 1px 1px 0;background:var(--sbink);}

  /* ===== 微信小程序胶囊（半透明白底黑边：三点 + 圆环） ===== */
  .capsule{position:absolute;top:49px;right:11px;width:88px;height:32px;border-radius:16px;background:rgba(255,255,255,.58);border:1px solid rgba(12,15,13,.45);backdrop-filter:blur(10px) saturate(1.6);-webkit-backdrop-filter:blur(10px) saturate(1.6);display:flex;align-items:center;z-index:60;}
  .capsule .c-dots{flex:1;display:flex;justify-content:center;gap:3.5px;}
  .capsule .c-dots i{width:4px;height:4px;border-radius:50%;background:#101312;}
  .capsule .c-div{width:1px;height:17px;background:rgba(12,15,13,.22);margin:0 1px;}
  .capsule .c-ring{flex:1;display:flex;align-items:center;justify-content:center;}
  .capsule .c-ring i{width:13px;height:13px;border-radius:50%;border:1.7px solid #101312;}

  /* ===== 轻提示 ===== */
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);background:rgba(23,29,26,.88);color:#f4f6f3;font-size:12px;letter-spacing:.08em;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s ease;z-index:80;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== 页面骨架 ===== */
  .page{min-height:100%;display:flex;flex-direction:column;}

  /* ===== 沉浸大图（上 2/3，底部渐入米灰） ===== */
  .hero{position:relative;height:520px;flex:none;overflow:hidden;}
  .hero .photo{width:100%;height:100%;object-fit:cover;display:block;background:#dfe6e2;}
  .hero .shade{position:absolute;top:0;left:0;right:0;height:110px;background:linear-gradient(180deg,rgba(9,13,11,.42),rgba(9,13,11,0));}
  .hero .fade{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(180deg,rgba(242,244,242,0) 0%,rgba(242,244,242,.52) 36%,rgba(242,244,242,.86) 66%,#f2f4f2 100%);}
  .hero .logo{position:absolute;top:58px;left:31px;height:64px;width:auto;max-width:200px;object-fit:contain;opacity:.96;}
  /* 竖排细线 + 竖排字：静奢东方的留白语言 */
  .hero .vert{position:absolute;right:31px;top:106px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .hero .vert i{width:1px;height:104px;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,0));}
  .hero .vert span{writing-mode:vertical-rl;font-family:var(--serif);font-weight:300;font-size:11px;letter-spacing:.5em;color:rgba(255,255,255,.88);}

  /* ===== 内容区（沉入米灰世界） ===== */
  .content{position:relative;flex:1;display:flex;flex-direction:column;margin-top:-88px;padding:0 31px;}
  .brand{margin-bottom:26px;}
  .brand h1{font-family:var(--serif);font-weight:300;font-size:26px;letter-spacing:.14em;color:#1e2b25;line-height:1.3;}
  .gold-label{display:flex;align-items:center;gap:10px;margin-top:11px;}
  .gold-label i{width:22px;height:1px;background:var(--gold);flex:none;}
  .gold-label span{font-size:9.5px;letter-spacing:.44em;color:var(--gold);}

  /* 宋式区块标题：小字 · 发丝线 · 宽字距 */
  .sec-label{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .sec-label span{font-family:var(--serif);font-weight:400;font-size:11px;letter-spacing:.5em;color:#5b6b62;white-space:nowrap;}
  .sec-label i{flex:1;height:1px;background:var(--hairline);}

  /* 两馆约课：竖向长条（发丝线分隔，非卡片底） */
  .strips{border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);margin-bottom:24px;}
  .strip{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;cursor:pointer;transition:transform .2s ease,text-align .2s;}
  .strip + .strip{border-top:1px solid var(--hairline);}
  .strip:active{transform:scale(.98);}
  .strip-name{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:.1em;color:var(--ink);}
  .strip-sub{margin-top:6px;font-size:10.5px;letter-spacing:.16em;color:var(--muted);}
  .strip:hover .strip-name{color:var(--green-deep);}

  /* 细箭头：长横线 + 斜角 */
  .arrow{position:relative;width:32px;height:12px;color:var(--green-deep);opacity:.55;transition:all .25s ease;flex:none;}
  .arrow::before{content:'';position:absolute;left:0;top:50%;width:24px;height:1px;background:currentColor;transform:translateY(-50%);}
  .arrow::after{content:'';position:absolute;right:3px;top:50%;width:8px;height:8px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:translateY(-50%) rotate(45deg);}
  .arrow.sm{width:24px;}
  .arrow.sm::before{width:16px;}
  a:hover .arrow,.row-hover:hover .arrow{opacity:1;transform:translateX(4px);}

  /* 金色细字链接：第一次来 */
  .guide-link{display:inline-flex;align-items:center;gap:9px;color:var(--gold);font-size:12px;letter-spacing:.18em;cursor:pointer;transition:opacity .2s;text-decoration:none;align-self:flex-start;}
  .guide-link .arrow{color:var(--gold);}
  .guide-link:hover{opacity:.72;}

  /* 底部内部入口 slogan（员工入口） */
  .slogan{margin-top:auto;padding:18px 0 30px;border-top:1px solid var(--hairline);text-align:center;cursor:pointer;transition:opacity .2s ease;}
  .slogan:hover{opacity:.7;}
  .slogan:active{opacity:.5;}
  .slogan p{font-size:12px;letter-spacing:.5em;padding-left:.5em;color:#5f7167;}
  .slogan small{display:block;margin-top:7px;font-size:9px;letter-spacing:.34em;padding-left:.34em;color:var(--faint);}
</style>
</head>
<body>
  <div class="phone immersive">
    <div class="screen">
      <div class="page">
        <header class="hero">
          <img class="photo" src="../assets/studio-oriental.png" alt="一麦瑜伽·普拉提 场馆" onerror="this.style.opacity='0'">
          <span class="shade"></span><span class="fade"></span>
          <img class="logo" src="../assets/logo-white.png" alt="一麦瑜伽" onerror="this.style.opacity='0'">
          <div class="vert"><i></i><span>日日是好日</span></div>
        </header>
        <main class="content">
          <div class="brand">
            <h1>一麦瑜伽·普拉提</h1>
            <div class="gold-label"><i></i><span>YIMAI YOGA · PILATES</span></div>
          </div>
          <div class="sec-label"><span>两馆约课</span><i></i></div>
          <nav class="strips">
            <a class="strip row-hover" onclick="toast('即将跳转 · 约课小程序')">
              <div><div class="strip-name">东部店</div><div class="strip-sub">江东 · 场馆</div></div>
              <span class="arrow"></span>
            </a>
            <a class="strip row-hover" onclick="toast('即将跳转 · 约课小程序')">
              <div><div class="strip-name">绿地店</div><div class="strip-sub">绿地缤纷城 · 4 楼</div></div>
              <span class="arrow"></span>
            </a>
          </nav>
          <a class="guide-link" href="guide.html">第一次来？到店指引<span class="arrow sm"></span></a>
          <div class="slogan" onclick="toast('员工通道 · 请验证身份')">
            <p>看见 · 包容 · 超越</p>
            <small>员工入口</small>
          </div>
        </main>
      </div>
    </div>
    <div class="statusbar">
      <span class="sb-time">9:41</span>
      <span class="sb-island"></span>
      <span class="sb-icons">
        <span class="sb-signal"><i></i><i></i><i></i><i></i></span>
        <span class="sb-wifi"><i></i><i></i><i></i><b></b></span>
        <span class="sb-battery"><i></i></span>
      </span>
    </div>
    <div class="capsule">
      <span class="c-dots"><i></i><i></i><i></i></span>
      <span class="c-div"></span>
      <span class="c-ring"><i></i></span>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script>
    var toastTimer=null;
    function toast(msg){
      var el=document.getElementById('toast');
      el.textContent=msg;el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer=setTimeout(function(){el.classList.remove('show');},1600);
    }
  </script>
</body>
</html>
